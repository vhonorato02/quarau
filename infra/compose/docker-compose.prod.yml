# Quarau — production stack (one VPS, shared reverse proxy).
#
# Deployed to /srv/apps/quarau by infra/scripts/deploy.sh. HTTPS, HTTP/3 and
# certificates come from the shared Traefik that Coolify already runs
# ("coolify-proxy", network "coolify"); see docs/decisions/0004.
#
# Every service has memory limits and rotated logs so the 4 GB VPS can host
# other projects too. Only `web`, `umami` and `uptime-kuma` join the proxy network.
name: quarau

x-logging: &logging
  driver: json-file
  options: { max-size: '10m', max-file: '5' }

x-restart: &restart
  restart: unless-stopped

networks:
  internal: {}
  proxy:
    external: true
    name: ${PROXY_NETWORK:-coolify}

volumes:
  pg: {}
  minio: {}
  meili: {}
  valkey: {}
  kuma: {}
  next-cache: {}

services:
  web:
    <<: *restart
    image: ${WEB_IMAGE:-ghcr.io/vhonorato02/quarau-web}:${WEB_TAG:-latest}
    env_file: .env
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: '3000'
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB}
      S3_ENDPOINT: http://minio:9000
      MEILI_HOST: http://meilisearch:7700
      REDIS_URL: redis://valkey:6379
      APP_VERSION: ${WEB_TAG:-latest}
    depends_on:
      pgbouncer: { condition: service_started }
      valkey: { condition: service_started }
      minio: { condition: service_started }
    volumes:
      - next-cache:/app/apps/web/.next/cache
    networks: [internal, proxy]
    logging: *logging
    deploy:
      resources:
        limits: { memory: 900m, cpus: '1.5' }
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:3000/next/health']
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 60s
    labels:
      traefik.enable: 'true'
      traefik.docker.network: ${PROXY_NETWORK:-coolify}
      traefik.http.routers.quarau-http.rule: ${TRAEFIK_RULE}
      traefik.http.routers.quarau-http.entrypoints: http
      traefik.http.routers.quarau-http.middlewares: quarau-https
      traefik.http.middlewares.quarau-https.redirectscheme.scheme: https
      traefik.http.middlewares.quarau-https.redirectscheme.permanent: 'true'
      traefik.http.routers.quarau.rule: ${TRAEFIK_RULE}
      traefik.http.routers.quarau.entrypoints: https
      traefik.http.routers.quarau.tls: 'true'
      traefik.http.routers.quarau.tls.certresolver: ${TRAEFIK_CERTRESOLVER:-letsencrypt}
      traefik.http.routers.quarau.middlewares: ${TRAEFIK_MIDDLEWARES:-quarau-headers,quarau-compress}
      traefik.http.services.quarau.loadbalancer.server.port: '3000'
      traefik.http.services.quarau.loadbalancer.healthcheck.path: /next/health
      traefik.http.services.quarau.loadbalancer.healthcheck.interval: 5s
      traefik.http.services.quarau.loadbalancer.healthcheck.timeout: 3s
      traefik.http.middlewares.quarau-compress.compress: 'true'
      traefik.http.middlewares.quarau-headers.headers.stsSeconds: '63072000'
      traefik.http.middlewares.quarau-headers.headers.stsIncludeSubdomains: 'true'
      traefik.http.middlewares.quarau-headers.headers.stsPreload: 'true'
      traefik.http.middlewares.quarau-headers.headers.contentTypeNosniff: 'true'
      traefik.http.middlewares.quarau-headers.headers.referrerPolicy: strict-origin-when-cross-origin
      traefik.http.middlewares.quarau-headers.headers.customResponseHeaders.Server: ''
      # Temporary domain protection (removed at go-live: see docs/go-live.md)
      traefik.http.middlewares.quarau-auth.basicauth.users: ${BASIC_AUTH_USERS:-}
      traefik.http.middlewares.quarau-auth.basicauth.realm: Quarau (homologacao)
      traefik.http.middlewares.quarau-noindex.headers.customResponseHeaders.X-Robots-Tag: 'noindex, nofollow'

  postgres:
    <<: *restart
    image: mirror.gcr.io/library/postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command:
      - postgres
      - -c
      - shared_buffers=192MB
      - -c
      - effective_cache_size=512MB
      - -c
      - work_mem=8MB
      - -c
      - max_connections=60
      - -c
      - log_min_duration_statement=500
    volumes:
      - pg:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    networks: [internal]
    logging: *logging
    deploy:
      resources:
        limits: { memory: 512m }
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      retries: 10

  pgbouncer:
    <<: *restart
    image: mirror.gcr.io/edoburu/pgbouncer:latest
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: '200'
      DEFAULT_POOL_SIZE: '20'
      AUTH_TYPE: scram-sha-256
      LISTEN_PORT: '6432'
    depends_on:
      postgres: { condition: service_healthy }
    networks: [internal]
    logging: *logging
    deploy:
      resources:
        limits: { memory: 64m }

  valkey:
    <<: *restart
    image: mirror.gcr.io/valkey/valkey:8-alpine
    command:
      [
        'valkey-server',
        '--maxmemory',
        '96mb',
        '--maxmemory-policy',
        'allkeys-lru',
        '--save',
        '',
        '--appendonly',
        'no',
      ]
    volumes:
      - valkey:/data
    networks: [internal]
    logging: *logging
    deploy:
      resources:
        limits: { memory: 128m }

  minio:
    <<: *restart
    image: ${MINIO_IMAGE:-cgr.dev/chainguard/minio:latest}
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
      MINIO_BROWSER: 'off'
    volumes:
      - minio:/data
    networks: [internal]
    logging: *logging
    deploy:
      resources:
        limits: { memory: 384m }

  meilisearch:
    <<: *restart
    image: mirror.gcr.io/getmeili/meilisearch:v1.16
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: 'true'
      MEILI_MAX_INDEXING_MEMORY: 256Mb
    volumes:
      - meili:/meili_data
    networks: [internal]
    logging: *logging
    deploy:
      resources:
        limits: { memory: 384m }

  umami:
    <<: *restart
    image: ghcr.io/umami-software/umami:postgresql-latest
    profiles: ['analytics']
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET}
      DISABLE_TELEMETRY: '1'
    depends_on:
      postgres: { condition: service_healthy }
    networks: [internal, proxy]
    logging: *logging
    deploy:
      resources:
        limits: { memory: 320m }
    labels:
      traefik.enable: 'true'
      traefik.docker.network: ${PROXY_NETWORK:-coolify}
      traefik.http.routers.quarau-umami.rule: Host(`${UMAMI_DOMAIN}`)
      traefik.http.routers.quarau-umami.entrypoints: https
      traefik.http.routers.quarau-umami.tls: 'true'
      traefik.http.routers.quarau-umami.tls.certresolver: ${TRAEFIK_CERTRESOLVER:-letsencrypt}
      traefik.http.services.quarau-umami.loadbalancer.server.port: '3000'

  uptime-kuma:
    <<: *restart
    image: mirror.gcr.io/louislam/uptime-kuma:2
    profiles: ['monitoring']
    volumes:
      - kuma:/app/data
    networks: [internal, proxy]
    logging: *logging
    deploy:
      resources:
        limits: { memory: 256m }
    labels:
      traefik.enable: 'true'
      traefik.docker.network: ${PROXY_NETWORK:-coolify}
      traefik.http.routers.quarau-status.rule: Host(`${STATUS_DOMAIN}`)
      traefik.http.routers.quarau-status.entrypoints: https
      traefik.http.routers.quarau-status.tls: 'true'
      traefik.http.routers.quarau-status.tls.certresolver: ${TRAEFIK_CERTRESOLVER:-letsencrypt}
      traefik.http.services.quarau-status.loadbalancer.server.port: '3001'
