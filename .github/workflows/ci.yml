name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/vhonorato02/quarau
  NODE_VERSION: '24'
  PAYLOAD_DB_PUSH: 'false'
  PAYLOAD_JOBS_AUTORUN: 'false'

jobs:
  quality:
    name: Format, lint, types, unit tests and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Zero visible text outside the CMS
        run: node tools/qa/hardcoded.mjs
      - run: pnpm audit --prod --audit-level=high

  integration:
    name: Payload integration (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: quarau_int
          # Disposable database, reachable only inside this GitHub runner.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d quarau_int"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres@localhost:5432/quarau_int
      SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Generate ephemeral application secret
        run: |
          secret=$(openssl rand -hex 32)
          echo "::add-mask::$secret"
          echo "PAYLOAD_SECRET=$secret" >> "$GITHUB_ENV"
      - run: pnpm --filter @quarau/web payload migrate
      - run: pnpm --filter @quarau/web test:int

  e2e:
    name: Production container, E2E, accessibility, Lighthouse and security
    needs: [quality, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      security-events: write
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: quarau_e2e
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d quarau_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_BASE_URL: http://localhost:3000
      E2E_ADMIN_EMAIL: e2e@quarau.local
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - uses: docker/setup-buildx-action@v3

      - name: Build content tools image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: tools
          load: true
          tags: quarau-tools:${{ github.sha }}
          cache-from: type=gha,scope=quarau
          build-args: APP_VERSION=${{ github.sha }}

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=quarau
          cache-to: type=gha,scope=quarau,mode=max
          build-args: APP_VERSION=${{ github.sha }}

      - name: Prepare isolated application environment
        run: |
          secret=$(openssl rand -hex 32)
          password=$(openssl rand -hex 24)
          echo "::add-mask::$secret"
          echo "::add-mask::$password"
          echo "E2E_ADMIN_PASSWORD=$password" >> "$GITHUB_ENV"
          umask 077
          cat > "$RUNNER_TEMP/quarau-e2e.env" <<EOF
          NODE_ENV=production
          SITE_URL=http://localhost:3000
          SITE_NOINDEX=false
          DATABASE_URL=postgres://postgres@localhost:5432/quarau_e2e
          PAYLOAD_SECRET=$secret
          PAYLOAD_DB_PUSH=false
          PAYLOAD_JOBS_AUTORUN=false
          MEDIA_DIR=/app/media
          SEED_OFFLINE=true
          ADMIN_EMAIL=$E2E_ADMIN_EMAIL
          ADMIN_PASSWORD=$password
          EOF
          docker volume create quarau-e2e-media

      - name: Apply migrations and seed offline content and administrator
        run: |
          docker run --rm --network host --env-file "$RUNNER_TEMP/quarau-e2e.env" \
            -v quarau-e2e-media:/app/media "quarau-tools:${{ github.sha }}" pnpm seed
          docker run --rm --network host --env-file "$RUNNER_TEMP/quarau-e2e.env" \
            -v quarau-e2e-media:/app/media "quarau-tools:${{ github.sha }}" pnpm seed:admin
          docker run --rm -v quarau-e2e-media:/app/media "quarau-tools:${{ github.sha }}" \
            chown -R 1001:1001 /app/media

      - name: Start non-root production container with read-only filesystem
        run: |
          docker run -d --name web --network host --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --memory 512m \
            --tmpfs /tmp \
            --tmpfs /app/.next/cache \
            --env-file "$RUNNER_TEMP/quarau-e2e.env" \
            -v quarau-e2e-media:/app/media "$IMAGE:${{ github.sha }}"
          curl --fail --silent --show-error --retry 60 --retry-delay 2 \
            --retry-connrefused --retry-all-errors --max-time 10 \
            http://localhost:3000/api/health

      - run: pnpm install --frozen-lockfile
      - name: Playwright E2E (desktop, mobile, CMS and axe)
        working-directory: apps/web
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e

      - name: Broken internal links
        run: pnpm dlx linkinator@6 http://localhost:3000 --recurse --skip "^(?!http://localhost:3000)|/admin|/api/" --timeout 20000

      - name: Lighthouse mobile (95 in all four categories)
        run: |
          export CHROME_PATH=$(cd apps/web && node --input-type=module -e "import { chromium } from '@playwright/test'; console.log(chromium.executablePath())")
          pnpm exec lhci autorun

      - name: Load test (k6)
        run: docker run --rm --network host -v "$PWD/tests/k6:/scripts:ro" grafana/k6:latest run -e BASE_URL=http://localhost:3000 /scripts/smoke.js

      - name: No filesystem errors in the container log
        # Same mounts as the VPS platform (read-only root, root-owned tmpfs): any write the app
        # attempts outside /app/media and /tmp shows up here after E2E, Lighthouse and k6.
        run: |
          docker logs web > web-check.log 2>&1
          if grep -nE 'EACCES|EROFS|Failed to update prerender cache|ENOENT: no such file or directory, mkdir' web-check.log; then
            echo "::error::the container tried to write outside its writable mounts"
            exit 1
          fi

      - name: Trivy (blocking critical vulnerabilities)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out" aquasec/trivy:latest \
            image --quiet --severity CRITICAL --ignore-unfixed --format sarif --output /out/trivy.sarif "$IMAGE:${{ github.sha }}"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest \
            image --quiet --severity CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE:${{ github.sha }}"
      - uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy.sarif') != '' && github.event_name != 'pull_request'
        with: { sarif_file: trivy.sarif, category: trivy }

      - name: Publish verified image to GHCR
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          docker push "$IMAGE:${{ github.sha }}"
          if [ "$REF_TYPE" = tag ]; then
            docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:$RELEASE_TAG"
            docker push "$IMAGE:$RELEASE_TAG"
          else
            docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi

      - name: Collect container diagnostics
        if: always()
        run: docker logs web --tail 300 > web.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-reports
          path: |
            apps/web/playwright-report
            apps/web/test-results
            .lighthouseci
            web.log
            trivy.sarif
          retention-days: 7
      - name: Remove disposable environment
        if: always()
        run: |
          docker rm -f web || true
          docker volume rm quarau-e2e-media || true
          rm -f "$RUNNER_TEMP/quarau-e2e.env"

  deploy:
    # Homologation on the VPS (ADR 0022): the image that passed every gate above goes live without
    # downtime. The forced SSH command on the server only accepts "deploy <tag>" for this site.
    name: Deploy to the VPS (homologation)
    needs: [e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    environment:
      name: homologation
      url: https://quarau.zewithane.vps.brz.dev.br
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ssh.zewithane.vps.brz.dev.br
      DEPLOY_PORT: '22322'
      SITE_URL: https://quarau.zewithane.vps.brz.dev.br
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Publish on the VPS (new replica, health check, then switch)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          printf '%s:%s\n' "$GH_ACTOR" "$GH_TOKEN" |
            ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" \
              -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
              "deploy@$DEPLOY_HOST" "deploy $GITHUB_SHA"
      - name: Smoke test (health reports this commit)
        run: |
          for i in $(seq 1 20); do
            body=$(curl -fsS --max-time 10 "$SITE_URL/api/health" || true)
            case "$body" in *"\"version\":\"$GITHUB_SHA\""*) echo "$body"; exit 0;; esac
            sleep 6
          done
          echo "::error::$SITE_URL/api/health does not report $GITHUB_SHA: $body"
          exit 1
      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/deploy_key
