name: VPS operations

# Manual operations on the production VPS (run from the Actions tab).
#   audit          read-only report of the server (no changes)
#   bootstrap      hardening + deploy user + cron/backups (respects the owner's SSH/UFW rules)
#   migrate-content  imports quarau.com.br content into production (idempotent)
#   create-admin   creates/resets the first CMS administrator (password stored on the VPS)
#   backup | restore-test | rollback | status
on:
  workflow_dispatch:
    inputs:
      action:
        description: Operação
        required: true
        type: choice
        options:
          [audit, bootstrap, migrate-content, create-admin, backup, restore-test, rollback, status]
      arg:
        description: 'Argumento opcional (tag do rollback, e-mail do admin, APPLY_SSH_HARDENING=1 …)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: vps-ops
  cancel-in-progress: false

env:
  VPS_HOST: ${{ secrets.VPS_HOST || '177.107.94.44' }}
  VPS_PORT: ${{ secrets.VPS_PORT || '22322' }}
  VPS_USER: ${{ secrets.VPS_USER || 'deploy' }}
  VPS_ADMIN_USER: ${{ secrets.VPS_ADMIN_USER || 'zewithane' }}
  APP_DIR: /srv/apps/quarau

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: SSH setup
        run: |
          [ -n "${{ secrets.VPS_SSH_KEY }}" ] || { echo "::error::Cadastre o secret VPS_SSH_KEY (ver docs/infra.md)"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          if [ -n "${{ secrets.VPS_KNOWN_HOSTS }}" ]; then printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          else ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" > ~/.ssh/known_hosts; fi
          echo "ADMIN_SSH=ssh -p $VPS_PORT -o BatchMode=yes $VPS_ADMIN_USER@$VPS_HOST" >> "$GITHUB_ENV"
          echo "SSH=ssh -p $VPS_PORT -o BatchMode=yes $VPS_USER@$VPS_HOST" >> "$GITHUB_ENV"

      - name: Audit (read-only)
        if: inputs.action == 'audit'
        run: |
          scp -P "$VPS_PORT" infra/scripts/bootstrap.sh "$VPS_ADMIN_USER@$VPS_HOST:/tmp/quarau-bootstrap.sh"
          $ADMIN_SSH "sudo bash /tmp/quarau-bootstrap.sh audit"

      - name: Bootstrap / hardening
        if: inputs.action == 'bootstrap'
        run: |
          pub=$(ssh-keygen -y -f ~/.ssh/id_ed25519)
          scp -P "$VPS_PORT" infra/scripts/bootstrap.sh "$VPS_ADMIN_USER@$VPS_HOST:/tmp/quarau-bootstrap.sh"
          $ADMIN_SSH "sudo APPLY=1 DEPLOY_PUBLIC_KEY='$pub' ${{ inputs.arg }} bash /tmp/quarau-bootstrap.sh apply"
          # Ship the stack files so the first deploy can run right away.
          rsync -az --rsync-path='sudo -u deploy rsync' -e "ssh -p $VPS_PORT" infra/scripts/ "$VPS_ADMIN_USER@$VPS_HOST:$APP_DIR/scripts/"
          rsync -az --rsync-path='sudo -u deploy rsync' -e "ssh -p $VPS_PORT" infra/compose/.env.production.example "$VPS_ADMIN_USER@$VPS_HOST:$APP_DIR/"
          $ADMIN_SSH "sudo -u deploy $APP_DIR/scripts/provision-env.sh '${{ vars.TEMP_DOMAIN || 'quarau.177-107-94-44.sslip.io' }}'"

      - name: Migrate content from quarau.com.br
        if: inputs.action == 'migrate-content' || inputs.action == 'create-admin'
        uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        if: inputs.action == 'migrate-content' || inputs.action == 'create-admin'
        with: { node-version: '22', cache: pnpm }
      - name: Open SSH tunnel to the stack
        if: inputs.action == 'migrate-content' || inputs.action == 'create-admin'
        run: |
          ip() { $SSH "docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}} {{end}}' \$(docker compose --project-directory $APP_DIR -f $APP_DIR/docker-compose.yml ps -q $1) | awk '{print \$1}'"; }
          PG=$(ip postgres); MINIO=$(ip minio); MEILI=$(ip meilisearch)
          ssh -p "$VPS_PORT" -f -N -o ExitOnForwardFailure=yes -L 15432:$PG:5432 -L 19000:$MINIO:9000 -L 17700:$MEILI:7700 "$VPS_USER@$VPS_HOST"
          # Read only what the scripts need from the remote .env, masking every secret.
          $SSH "grep -E '^(POSTGRES_USER|POSTGRES_PASSWORD|POSTGRES_DB|PAYLOAD_SECRET|S3_BUCKET|S3_ACCESS_KEY_ID|S3_SECRET_ACCESS_KEY|MEILI_MASTER_KEY|MEILI_INDEX)=' $APP_DIR/.env" > remote.env
          while IFS='=' read -r k v; do echo "::add-mask::$v"; done < remote.env
          set -a; source remote.env; set +a
          {
            echo "DATABASE_URL=postgres://$POSTGRES_USER:$POSTGRES_PASSWORD@localhost:15432/$POSTGRES_DB"
            echo "PAYLOAD_SECRET=$PAYLOAD_SECRET"
            echo "S3_ENDPOINT=http://localhost:19000"; echo "S3_BUCKET=$S3_BUCKET"
            echo "S3_ACCESS_KEY_ID=$S3_ACCESS_KEY_ID"; echo "S3_SECRET_ACCESS_KEY=$S3_SECRET_ACCESS_KEY"
            echo "MEILI_HOST=http://localhost:17700"; echo "MEILI_MASTER_KEY=$MEILI_MASTER_KEY"; echo "MEILI_INDEX=$MEILI_INDEX"
            echo "NODE_ENV=production"; echo "PAYLOAD_JOBS_AUTORUN=false"
          } >> "$GITHUB_ENV"
          rm remote.env
      - name: Run content migration
        if: inputs.action == 'migrate-content'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pnpm install --frozen-lockfile
          pnpm --filter @quarau/web migrate:wp
          $SSH "docker exec \$(docker compose --project-directory $APP_DIR -f $APP_DIR/docker-compose.yml ps -q web | head -1) sh -c 'curl -fsS -X POST -H \"authorization: Bearer \$REVALIDATE_SECRET\" -d {\\\"all\\\":true} http://127.0.0.1:3000/next/revalidate && curl -fsS -X POST -H \"authorization: Bearer \$REVALIDATE_SECRET\" http://127.0.0.1:3000/next/reindex'"
      - name: Create administrator
        if: inputs.action == 'create-admin'
        run: |
          pnpm install --frozen-lockfile
          [ -n "${{ inputs.arg }}" ] || { echo "::error::Informe o e-mail do administrador no campo arg"; exit 1; }
          pass=$(openssl rand -base64 32 | tr -dc 'A-Za-z0-9' | head -c 22)
          echo "::add-mask::$pass"
          ADMIN_EMAIL="${{ inputs.arg }}" ADMIN_NAME="Administrador" ADMIN_PASSWORD="$pass" pnpm --filter @quarau/web seed:admin
          printf 'Admin CMS: %s / %s\n' "${{ inputs.arg }}" "$pass" | $SSH "umask 077; cat >> $APP_DIR/CREDENCIAIS.txt"
          echo "Senha gravada em $APP_DIR/CREDENCIAIS.txt no servidor (não exibida no log)."

      - name: Backup now
        if: inputs.action == 'backup'
        run: $SSH "sudo $APP_DIR/scripts/backup.sh"
      - name: Restore drill
        if: inputs.action == 'restore-test'
        run: $SSH "sudo $APP_DIR/scripts/restore-test.sh"
      - name: Rollback
        if: inputs.action == 'rollback'
        run: $SSH "$APP_DIR/scripts/rollback.sh ${{ inputs.arg }}"
      - name: Status
        if: inputs.action == 'status'
        run: |
          $SSH "cd $APP_DIR && docker compose ps && tail -5 releases.log 2>/dev/null; df -h / | tail -1; free -m | head -2; tail -3 logs/backup.log 2>/dev/null || true"
